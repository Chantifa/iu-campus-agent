# docker compose up -d                        # qdrant + an idle agent container
# docker compose run --rm agent ingest        # index the mounted documents folder
# docker compose exec -it agent iu-agent chat # interactive chat (or: docker compose run --rm agent chat)
# docker compose run --rm agent moodle login --no-browser
# docker compose run --rm agent moodle sync
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: iu-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: .
    image: iu-campus-agent:latest
    # `docker compose up` cannot run an interactive chat, so the service idles and you attach with
    # `docker compose exec -it agent iu-agent chat`; `docker compose run --rm agent <cmd>` still works.
    command: ["idle"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      IU_DOCS_PATH: /data/iu
      WORKSPACE_DIR: /workspace
    volumes:
      # source folder with the course material (read-only) - set IU_DOCS_HOST_PATH in .env
      - "${IU_DOCS_HOST_PATH:-./data/docs}:/data/iu:ro"
      # folder the agent may edit / run commands in
      - "${WORKSPACE_HOST_PATH:-./workspace}:/workspace"
      # manifest, cached models, Moodle token, chat history
      - agent_data:/app/data
    stdin_open: true
    tty: true
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  agent_data:
