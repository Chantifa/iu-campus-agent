# The agent is a CLI, so the pod idles and you attach to it:
#   kubectl -n iu-agent exec -it deploy/iu-agent -- iu-agent chat
# The pod is also the upload target for the course material (scripts/k8s-upload-docs.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iu-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iu-agent
  template:
    metadata:
      labels:
        app: iu-agent
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: agent
          image: iu-campus-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          stdin: true
          tty: true
          # Order matters: a later source overrides an earlier one, so the secret (usually created
          # from the whole .env, which may contain Windows paths) comes first and the cluster
          # ConfigMap second. The explicit env entries below win over both.
          envFrom:
            - secretRef:
                name: iu-agent-secrets
                optional: true
            - configMapRef:
                name: iu-agent-config
          env:
            - name: IU_DOCS_PATH
              value: /data/iu
            - name: DATA_DIR
              value: /app/data
            - name: WORKSPACE_DIR
              value: /workspace
            - name: QDRANT_URL
              value: http://qdrant:6333
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: docs
              mountPath: /data/iu
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iu-agent-data
        - name: docs
          persistentVolumeClaim:
            claimName: iu-agent-docs
        - name: workspace
          emptyDir: {}
