# One-off indexing run:  kubectl -n iu-agent delete job iu-agent-ingest; kubectl apply -k k8s/
apiVersion: batch/v1
kind: Job
metadata:
  name: iu-agent-ingest
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: iu-agent-ingest
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: iu-campus-agent:latest
          imagePullPolicy: IfNotPresent
          args: ["ingest"]
          envFrom:
            - configMapRef:
                name: iu-agent-config
            - secretRef:
                name: iu-agent-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: docs
              mountPath: /data/iu
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iu-agent-data
        - name: docs
          hostPath:
            path: /run/desktop/mnt/host/c/Users/X/OneDrive/IU
            type: Directory
