# Indexes the uploaded course material. The container waits until the upload script has written
# /data/iu/.upload-complete, so `kubectl apply -k k8s/` can be run before the upload.
# Re-run later with:  kubectl -n iu-agent delete job iu-agent-ingest; kubectl apply -k k8s/
# Pause / resume:     kubectl -n iu-agent patch job iu-agent-ingest -p '{"spec":{"suspend":true}}'   (false to resume)
apiVersion: batch/v1
kind: Job
metadata:
  name: iu-agent-ingest
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: iu-agent-ingest
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      containers:
        - name: ingest
          image: iu-campus-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until [ -f /data/iu/.upload-complete ]; do
                echo "waiting for the course material in /data/iu (run scripts/k8s-upload-docs.sh)"
                sleep 20
              done
              exec iu-agent ingest
          # Secret first, ConfigMap second (later sources win); explicit env entries win over both.
          envFrom:
            - secretRef:
                name: iu-agent-secrets
                optional: true
            - configMapRef:
                name: iu-agent-config
          env:
            - name: IU_DOCS_PATH
              value: /data/iu
            - name: DATA_DIR
              value: /app/data
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: EMBEDDING_THREADS
              value: "3"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: docs
              mountPath: /data/iu
              readOnly: true
          # Embedding is CPU bound; the limit keeps a laptop usable while the job runs for hours.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iu-agent-data
        - name: docs
          persistentVolumeClaim:
            claimName: iu-agent-docs
