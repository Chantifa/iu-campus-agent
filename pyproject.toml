[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iu-campus-agent"
version = "0.1.0"
description = "Claude-Code-style CLI agent built with LangChain + LangGraph, with a RAG over IU myCampus course material (Moodle API or OneDrive folder) in Qdrant."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Chantifa" }]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-qdrant>=1.0,<2",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "anthropic>=1.0",
    "rich>=14",
    "prompt_toolkit>=3.0.50",
    "typer>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pymupdf>=1.26",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
iu-agent = "iu_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/iu_agent/cli.py" = ["B008"]  # typer.Option / typer.Argument defaults are the typer idiom
"tests/*" = ["E501"]  # fixture data lines
